<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Scholar Seas{% endblock %}</title>

    <style>
        :root {
            --navy: #0a1932;
            --blue: #164b73;
            --cream: #f5e6be;
            --gold: #e6b43c;
            --brown: #5a371e;
            --green: #239652;
            --red: #b42d2d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(10, 25, 50, 0.86),
                    rgba(10, 25, 50, 0.96)
                ),
                repeating-linear-gradient(
                    0deg,
                    #164b73 0,
                    #164b73 24px,
                    #19577f 24px,
                    #19577f 48px
                );
            color: var(--cream);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 7%;
            background: var(--navy);
            border-bottom: 4px solid var(--gold);
        }

        header h1 {
            margin: 0;
            color: var(--gold);
        }

        nav a {
            margin-left: 20px;
            color: var(--cream);
            font-weight: bold;
            text-decoration: none;
        }

        nav a:hover {
            color: var(--gold);
        }

        main {
            width: min(1100px, 92%);
            margin: 45px auto;
        }

        .panel {
            padding: 30px;
            background: var(--cream);
            color: var(--brown);
            border: 5px solid var(--gold);
            border-radius: 14px;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            color: var(--brown);
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 3px solid var(--brown);
            border-radius: 6px;
            font-size: 17px;
        }

        button,
        .button {
            display: inline-block;
            padding: 13px 22px;
            background: var(--brown);
            color: var(--cream);
            border: 3px solid var(--gold);
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        .button:hover {
            background: var(--blue);
        }

        .message {
            min-height: 24px;
            color: var(--red);
            font-weight: bold;
        }

        .button-row {
            display: flex;
            gap: 15px;
            margin-top: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 22px;
        }

        .card {
            padding: 22px;
            background: var(--navy);
            color: var(--cream);
            border: 4px solid var(--gold);
            border-radius: 10px;
        }

        .card h3 {
            color: var(--gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 13px;
            border: 2px solid var(--brown);
            text-align: left;
        }

        th {
            background: var(--brown);
            color: var(--cream);
        }
    </style>
</head>

<body>
    <header>
        <h1>Scholar Seas</h1>

        <nav>
            {% if session.get("parent_id") %}
                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>
                <a href="{{ url_for('logout') }}">
                    Log out
                </a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
